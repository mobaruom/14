<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Définitions STMG (Groq API)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #60a5fa; margin-bottom: 8px; font-size: 1.8rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
    .card h2 { color: #60a5fa; font-size: 1.1rem; margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 0.9rem; font-weight: 500; }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 0.95rem; transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #60a5fa; }
    textarea { min-height: 180px; resize: vertical; font-family: monospace; font-size: 0.85rem; line-height: 1.5; }
    .btn {
      padding: 12px 20px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: white; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box { background: #1e293b; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #334155; }
    .stat-value { font-size: 1.6rem; font-weight: 700; color: #60a5fa; }
    .stat-label { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .log { background: #0f172a; border-radius: 10px; padding: 12px; max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; border: 1px solid #334155; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #1e293b; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-info { color: #60a5fa; }
    .definition-card { background: #0f172a; border-radius: 10px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #3b82f620; color: #60a5fa; }
    .term-title { font-weight: 700; font-size: 1rem; margin: 6px 0; }
    .term-def { color: #cbd5e1; font-size: 0.9rem; line-height: 1.5; }
    .term-sub { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; font-style: italic; }
    .hidden { display: none !important; }
    .relative { position: relative; }
    .copy-btn { position: absolute; top: 12px; right: 12px; background: #334155; border: none; color: #e2e8f0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Générateur de Définitions STMG</h1>
    <p class="subtitle">Génération en masse via l'API Groq</p>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-box"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat-box"><div class="stat-value" id="stat-done">0</div><div class="stat-label">Générés</div></div>
      <div class="stat-box"><div class="stat-value" id="stat-remaining">0</div><div class="stat-label">Restants</div></div>
    </div>

    <!-- CONFIGURATION -->
    <div class="card">
      <h2>🔑 Configuration Groq</h2>
      <label>Clé API Groq</label>
      <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveKey()">
      
      <div style="margin-top:12px;">
        <label>Modèle</label>
        <select id="model">
          <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Recommandé - Recommandé pour la qualité)</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B (Très rapide)</option>
        </select>
      </div>
    </div>

    <!-- LISTE DES TERMES -->
    <div class="card">
      <h2>📝 Liste des termes</h2>
      <p style="color:#94a3b8;font-size:0.85rem;margin-bottom:12px;">
        Format : <code>MATIERE: terme</code> (une ligne par entrée)
      </p>
      <textarea id="termsInput" placeholder="Économie: Prix d'équilibre&#10;Management: Organigramme&#10;Droit: Contrat de travail&#10;RH: Recrutement"></textarea>
      
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="loadExample()">📋 Exemple</button>
        <button class="btn btn-primary" onclick="clearTerms()">🗑️ Vider</button>
        <button class="btn btn-success" onclick="startGeneration()">🚀 Lancer la génération</button>
        <button class="btn btn-danger" onclick="stopGeneration()">⏹️ Arrêter</button>
      </div>
    </div>

    <!-- LOGS -->
    <div class="card">
      <h2>📋 Console de Suivi</h2>
      <div class="log" id="log"></div>
    </div>

    <!-- RÉSULTATS -->
    <div class="card hidden" id="resultsCard">
      <h2>✅ Résultats (<span id="resultsCount">0</span>)</h2>
      <div id="resultsList"></div>
      
      <div class="relative" style="margin-top:16px;">
        <label>JSON final (Prêt à être copier/collé)</label>
        <textarea id="jsonOutput" readonly style="min-height:150px;"></textarea>
        <button class="copy-btn" onclick="copyJSON()">📋 Copier</button>
      </div>
    </div>
  </div>

  <script>
    const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
    
    let definitions = [];
    let isRunning = false;
    let shouldStop = false;

    window.onload = () => {
      const savedKey = localStorage.getItem('groq_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
      
      const savedTerms = localStorage.getItem('stmg_terms');
      if (savedTerms) document.getElementById('termsInput').value = savedTerms;
      updateStats();
    };

    function saveKey() {
      localStorage.setItem('groq_api_key', document.getElementById('apiKey').value.trim());
    }

    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      const time = new Date().toLocaleTimeString('fr-FR');
      entry.textContent = `[${time}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function parseTerms() {
      const input = document.getElementById('termsInput').value;
      localStorage.setItem('stmg_terms', input);
      
      const lines = input.split('\n');
      const terms = [];
      
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        
        const sepIndex = trimmed.indexOf(':');
        if (sepIndex > 0) {
          const matiere = trimmed.substring(0, sepIndex).trim();
          const terme = trimmed.substring(sepIndex + 1).trim();
          if (matiere && terme) {
            terms.push({ matiere, terme });
          }
        }
      });
      return terms;
    }

    function updateStats() {
      const terms = parseTerms();
      document.getElementById('stat-total').textContent = terms.length;
      document.getElementById('stat-done').textContent = definitions.length;
      document.getElementById('stat-remaining').textContent = Math.max(0, terms.length - definitions.length);
    }

    function loadExample() {
      document.getElementById('termsInput').value = `Économie: Prix d'équilibre\nÉconomie: Inflation\nManagement: Organigramme\nDroit: Contrat de travail\nRH: Recrutement`;
      updateStats();
    }

    function clearTerms() {
      document.getElementById('termsInput').value = '';
      definitions = [];
      document.getElementById('resultsList').innerHTML = '';
      document.getElementById('jsonOutput').value = '';
      document.getElementById('resultsCard').classList.add('hidden');
      updateStats();
    }

    async function startGeneration() {
      if (isRunning) return;
      
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        log('❌ Clé API Groq manquante !', 'error');
        return;
      }
      
      const terms = parseTerms();
      if (terms.length === 0) {
        log('❌ Aucun terme au format "Matière: Terme" trouvé.', 'error');
        return;
      }

      isRunning = true;
      shouldStop = false;
      log(`🚀 Début du traitement de ${terms.length} terme(s)...`, 'info');

      for (let i = 0; i < terms.length; i++) {
        if (shouldStop) {
          log('⏹️ Génération interrompue.', 'error');
          break;
        }

        const { matiere, terme } = terms[i];
        
        // Vérifie si déjà généré
        if (definitions.some(d => d.term.toLowerCase() === terme.toLowerCase())) {
          continue;
        }

        log(`[${i+1}/${terms.length}] Traitement : "${terme}" (${matiere})...`);

        try {
          const res = await fetchDefinitionFromGroq(terme, matiere, apiKey);
          if (res) {
            definitions.push(res);
            addResultCard(res);
            updateJSON();
            log(`✅ Généré : "${terme}"`, 'success');
          }
        } catch (err) {
          log(`❌ Erreur sur "${terme}": ${err.message}`, 'error');
          if (err.message.includes('429')) {
            log('⏳ Rate limit dépassé. Pause de 5 secondes...', 'error');
            await sleep(5000);
            i--; // Recommence le même terme
          }
        }

        updateStats();
        await sleep(1000); // Pause anti-spam API
      }

      isRunning = false;
      log('🏁 Génération terminée !', 'success');
    }

    function stopGeneration() {
      shouldStop = true;
    }

    async function fetchDefinitionFromGroq(terme, matiere, apiKey) {
      const model = document.getElementById('model').value;

      const systemPrompt = `Tu es un réducteur de contenu pédagogique spécialisé pour la filière STMG.
Tu dois répondre STRICTEMENT au format JSON respectant ce schéma exact :
{
  "term": "nom du terme",
  "matiere": "nom de la matiere",
  "def": "Définition courte et claire (2-3 phrases max)",
  "example": "Exemple concret (1 phrase) ou chaîne vide si inutile",
  "remember": "Moyen mnémotechnique ou idée-clé"
}`;

      const userPrompt = `Génère la fiche pour le terme "${terme}" en matière "${matiere}".`;

      const response = await fetch(GROQ_URL, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: userPrompt }
          ],
          response_format: { type: "json_object" },
          temperature: 0.2
        })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const content = data.choices[0].message.content;
      return JSON.parse(content);
    }

    function addResultCard(def) {
      document.getElementById('resultsCard').classList.remove('hidden');
      const list = document.getElementById('resultsList');
      const card = document.createElement('div');
      card.className = 'definition-card';
      card.innerHTML = `
        <span class="badge">${def.matiere}</span>
        <div class="term-title">${def.term}</div>
        <div class="term-def">${def.def}</div>
        ${def.example ? `<div class="term-sub">💡 Exemple : ${def.example}</div>` : ''}
        ${def.remember ? `<div class="term-sub">🧠 Astuce : ${def.remember}</div>` : ''}
      `;
      list.prepend(card);
    }

    function updateJSON() {
      const json = JSON.stringify(definitions, null, 2);
      document.getElementById('jsonOutput').value = json;
      document.getElementById('resultsCount').textContent = definitions.length;
    }

    function copyJSON() {
      const json = document.getElementById('jsonOutput').value;
      navigator.clipboard.writeText(json);
      alert('JSON copié dans le presse-papier !');
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
