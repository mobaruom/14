<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Définitions STMG (Groq API)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #60a5fa; margin-bottom: 8px; font-size: 1.8rem; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
    .card h2 { color: #60a5fa; font-size: 1.1rem; margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 0.9rem; font-weight: 500; }
    input, textarea {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 0.95rem; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { outline: none; border-color: #60a5fa; }
    textarea { min-height: 160px; resize: vertical; font-family: monospace; font-size: 0.85rem; line-height: 1.5; }
    .btn {
      padding: 12px 20px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box { background: #1e293b; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #334155; }
    .stat-value { font-size: 1.6rem; font-weight: 700; color: #60a5fa; }
    .stat-label { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .log { background: #0f172a; border-radius: 10px; padding: 12px; max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; border: 1px solid #334155; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #1e293b; }
    .log-success { color: #34d399; }
    .log-error { color: #f87171; }
    .log-info { color: #60a5fa; }
    .definition-card { background: #0f172a; border-radius: 10px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #3b82f620; color: #60a5fa; }
    .term-title { font-weight: 700; font-size: 1rem; margin: 6px 0; }
    .term-def { color: #cbd5e1; font-size: 0.9rem; line-height: 1.5; }
    .term-sub { font-size: 0.85rem; color: #94a3b8; margin-top: 6px; font-style: italic; }
    .hidden { display: none !important; }
    .relative { position: relative; }
    .copy-btn { position: absolute; top: 12px; right: 12px; background: #334155; border: none; color: #e2e8f0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .status-line { font-size: 0.8rem; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Générateur de Définitions STMG</h1>
    <p class="subtitle">Colle tes termes, l'IA fait le reste</p>

    <div class="stats">
      <div class="stat-box"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat-box"><div class="stat-value" id="stat-done">0</div><div class="stat-label">Générés</div></div>
      <div class="stat-box"><div class="stat-value" id="stat-remaining">0</div><div class="stat-label">Restants</div></div>
    </div>

    <div class="card">
      <label>Clé API Groq</label>
      <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveKey()">
      <div class="status-line" id="storageStatus"></div>
    </div>

    <div class="card">
      <h2>📝 Termes à générer</h2>
      <textarea id="termsInput" placeholder="Prix d'équilibre&#10;Organigramme&#10;Contrat de travail&#10;Recrutement" oninput="updateStats()"></textarea>
      <p style="color:#64748b;font-size:0.8rem;margin-top:6px;">Un terme par ligne. La matière (Éco, Management, Droit, RH...) est déduite automatiquement.</p>

      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-success" id="btnStart" onclick="startGeneration()">🚀 Générer</button>
        <button class="btn btn-danger" id="btnStop" onclick="stopGeneration()" disabled>⏹️ Arrêter</button>
        <button class="btn btn-primary" id="btnClear" onclick="clearTerms()">🗑️ Vider</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 Console de Suivi</h2>
      <div class="log" id="log"></div>
    </div>

    <div class="card hidden" id="resultsCard">
      <h2>✅ Résultats (<span id="resultsCount">0</span>)</h2>
      <div id="resultsList"></div>

      <div class="relative" style="margin-top:16px;">
        <label>JSON final (Prêt à être copié/collé)</label>
        <textarea id="jsonOutput" readonly style="min-height:150px;"></textarea>
        <button class="copy-btn" onclick="copyJSON()">📋 Copier</button>
      </div>
    </div>
  </div>

  <script>
    const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
    const MODEL_CHAIN = ['openai/gpt-oss-120b', 'openai/gpt-oss-20b'];

    let definitions = [];
    let isRunning = false;
    let shouldStop = false;
    let storageAvailable = false;

    async function initStorage() {
      const statusEl = document.getElementById('storageStatus');
      try {
        if (window.storage && typeof window.storage.get === 'function') {
          storageAvailable = true;
          const savedKey = await safeGet('groq_api_key');
          if (savedKey) document.getElementById('apiKey').value = savedKey;
          const savedTerms = await safeGet('stmg_terms');
          if (savedTerms) document.getElementById('termsInput').value = savedTerms;
          statusEl.textContent = 'Clé et liste mémorisées sur cet appareil.';
        } else {
          statusEl.textContent = "Mémorisation indisponible ici : rien n'est sauvegardé entre deux sessions.";
        }
      } catch (e) {
        storageAvailable = false;
        statusEl.textContent = "Mémorisation indisponible ici : rien n'est sauvegardé entre deux sessions.";
      }
      updateStats();
    }

    async function safeGet(key) {
      try {
        const result = await window.storage.get(key, false);
        return result ? result.value : null;
      } catch (e) { return null; }
    }

    async function safeSet(key, value) {
      if (!storageAvailable) return;
      try { await window.storage.set(key, value, false); } catch (e) { }
    }

    function saveKey() {
      safeSet('groq_api_key', document.getElementById('apiKey').value.trim());
    }

    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      const time = new Date().toLocaleTimeString('fr-FR');
      entry.textContent = `[${time}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function parseTerms() {
      const input = document.getElementById('termsInput').value;
      safeSet('stmg_terms', input);
      return input.split('\n').map(l => l.trim()).filter(Boolean);
    }

    function updateStats() {
      const terms = parseTerms();
      document.getElementById('stat-total').textContent = terms.length;
      document.getElementById('stat-done').textContent = definitions.length;
      document.getElementById('stat-remaining').textContent = Math.max(0, terms.length - definitions.length);
    }

    function clearTerms() {
      document.getElementById('termsInput').value = '';
      definitions = [];
      document.getElementById('resultsList').innerHTML = '';
      document.getElementById('jsonOutput').value = '';
      document.getElementById('resultsCard').classList.add('hidden');
      updateStats();
    }

    function setRunningUI(running) {
      document.getElementById('btnStart').disabled = running;
      document.getElementById('btnClear').disabled = running;
      document.getElementById('btnStop').disabled = !running;
    }

    async function startGeneration() {
      if (isRunning) return;

      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        log('❌ Clé API Groq manquante !', 'error');
        return;
      }

      const terms = parseTerms();
      if (terms.length === 0) {
        log('❌ Aucun terme saisi.', 'error');
        return;
      }

      isRunning = true;
      shouldStop = false;
      setRunningUI(true);
      log(`🚀 Début du traitement de ${terms.length} terme(s)...`, 'info');

      for (let i = 0; i < terms.length; i++) {
        if (shouldStop) {
          log('⏹️ Génération interrompue.', 'error');
          break;
        }

        const terme = terms[i];
        if (definitions.some(d => d.term.toLowerCase() === terme.toLowerCase())) continue;

        log(`[${i + 1}/${terms.length}] Traitement : "${terme}"...`);

        let retried = false;
        try {
          const res = await fetchDefinitionWithFallback(terme, apiKey);
          if (res) {
            definitions.push(res);
            addResultCard(res);
            updateJSON();
            log(`✅ Généré : "${terme}" (${res.matiere})`, 'success');
          }
        } catch (err) {
          log(`❌ Erreur sur "${terme}": ${err.message}`, 'error');
          if (err.message.includes('429') && !shouldStop) {
            log('⏳ Rate limit dépassé. Pause de 5 secondes...', 'error');
            await sleep(5000);
            i--;
            retried = true;
          } else if (err.message.includes('401') || err.message.toLowerCase().includes('invalid api key')) {
            log('🛑 Clé API invalide. Arrêt de la génération.', 'error');
            shouldStop = true;
          }
        }

        updateStats();
        if (!retried) await sleep(800);
      }

      isRunning = false;
      setRunningUI(false);
      log('🏁 Terminé !', 'success');
    }

    function stopGeneration() { shouldStop = true; }

    async function fetchDefinitionWithFallback(terme, apiKey) {
      let lastErr;
      for (const model of MODEL_CHAIN) {
        try {
          return await fetchDefinitionFromGroq(terme, apiKey, model);
        } catch (err) {
          lastErr = err;
          const msg = err.message.toLowerCase();
          if (msg.includes('404') || msg.includes('does not exist') || msg.includes('decommissioned')) {
            log(`↪️ Modèle "${model}" indisponible, essai suivant...`, 'info');
            continue;
          }
          throw err;
        }
      }
      throw lastErr;
    }

    async function fetchDefinitionFromGroq(terme, apiKey, model) {
      const systemPrompt = `Tu es un rédacteur de contenu pédagogique spécialisé pour la filière STMG (lycée français : Management, Droit, Économie, Sciences de gestion et numérique, RH...).
Pour le terme donné, identifie toi-même la matière STMG la plus pertinente.
Tu dois répondre STRICTEMENT au format JSON suivant, sans aucun texte hors du JSON :
{
  "term": "nom du terme",
  "matiere": "matière STMG déduite",
  "def": "Définition courte et claire (2-3 phrases max)",
  "example": "Exemple concret (1 phrase) ou chaîne vide si inutile",
  "remember": "Moyen mnémotechnique ou idée-clé"
}`;

      const userPrompt = `Génère la fiche pour le terme "${terme}".`;

      let response;
      try {
        response = await fetch(GROQ_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt }
            ],
            response_format: { type: 'json_object' },
            temperature: 0.2
          })
        });
      } catch (networkErr) {
        throw new Error(`Réseau : impossible de joindre l'API Groq (${networkErr.message})`);
      }

      if (!response.ok) {
        let errMsg = `HTTP ${response.status}`;
        try {
          const errorData = await response.json();
          if (errorData?.error?.message) errMsg = errorData.error.message + ` (${response.status})`;
        } catch (e) { }
        throw new Error(errMsg);
      }

      const data = await response.json();
      const content = data?.choices?.[0]?.message?.content;
      if (!content) throw new Error("Réponse vide ou mal formée de l'API.");

      let parsed;
      try { parsed = JSON.parse(content); }
      catch (e) { throw new Error("Le modèle n'a pas renvoyé un JSON valide."); }

      if (!parsed.term || !parsed.def) throw new Error('JSON incomplet renvoyé par le modèle.');
      return parsed;
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function addResultCard(def) {
      document.getElementById('resultsCard').classList.remove('hidden');
      const list = document.getElementById('resultsList');
      const card = document.createElement('div');
      card.className = 'definition-card';
      card.innerHTML = `
        <span class="badge">${escapeHTML(def.matiere)}</span>
        <div class="term-title">${escapeHTML(def.term)}</div>
        <div class="term-def">${escapeHTML(def.def)}</div>
        ${def.example ? `<div class="term-sub">💡 Exemple : ${escapeHTML(def.example)}</div>` : ''}
        ${def.remember ? `<div class="term-sub">🧠 Astuce : ${escapeHTML(def.remember)}</div>` : ''}
      `;
      list.prepend(card);
    }

    function updateJSON() {
      document.getElementById('jsonOutput').value = JSON.stringify(definitions, null, 2);
      document.getElementById('resultsCount').textContent = definitions.length;
    }

    function copyJSON() {
      const json = document.getElementById('jsonOutput').value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json)
          .then(() => log('📋 JSON copié dans le presse-papier.', 'success'))
          .catch(() => fallbackCopy(json));
      } else {
        fallbackCopy(json);
      }
    }

    function fallbackCopy(text) {
      const ta = document.getElementById('jsonOutput');
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        log('📋 JSON copié dans le presse-papier.', 'success');
      } catch (e) {
        log('❌ Impossible de copier automatiquement. Sélectionnez le texte manuellement.', 'error');
      }
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    initStorage();
  </script>
</body>
</html>
